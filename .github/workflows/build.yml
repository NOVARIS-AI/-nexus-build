name: Build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate database migration sequence
        run: npm run check:migrations\n        env:\n          MIGRATION_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
      - run: npm run build
