name: Deploy Nexus Build to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-build-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate database migration sequence
        run: npm run check:migrations
        env:
          MIGRATION_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
      - run: npm run build
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply nexus-build-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and static app
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Run live API smoke tests
        run: node scripts/smoke-test-api.mjs
        env:
          API_BASE_URL: https://nexus-build.schoolershubit5.workers.dev
