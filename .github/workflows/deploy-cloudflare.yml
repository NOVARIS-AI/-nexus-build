name: Deploy Nexus Build to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate database migration sequence
        run: npm run check:migrations
      - run: npm run build
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply nexus-build-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and static app
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed API health
        run: |
          response="$(curl --silent --show-error --fail-with-body https://nexus-build.schoolershubit5.workers.dev/api/health)"
          node -e 'const health=JSON.parse(process.argv[1]); if(!health.ok || !health.databaseReady) { console.error("API health check failed:", health); process.exit(1); } console.log("API and D1 database are ready.");' "$response"
